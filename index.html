<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Radar 24</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f14;--panel:rgba(15,20,27,.8);--line:rgba(255,255,255,.08);--ink:#eef2f6;--dim:#8b97a6;--radar:#64748b;--hrrr:#38bdf8;--model:#a78bfa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 Geist,system-ui,-apple-system,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
#map{position:fixed;inset:0;background:var(--bg)}
.leaflet-container{background:var(--bg);font-family:inherit}
.leaflet-control-attribution{background:rgba(0,0,0,.45)!important;color:#7d8794!important;font-size:10px;}
.leaflet-control-attribution a{color:#9aa5b1!important}
.leaflet-top{top:calc(env(safe-area-inset-top) + 60px)}
.leaflet-top .leaflet-control-attribution{border-radius:8px;margin:0 0 0 10px}
@media (min-width:900px){.leaflet-top{top:72px}.leaflet-top .leaflet-control-attribution{margin-left:16px}}
.glass{background:var(--panel);-webkit-backdrop-filter:blur(18px) saturate(1.4);backdrop-filter:blur(18px) saturate(1.4);border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 32px rgba(0,0,0,.35)}
#top{position:fixed;z-index:1000;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;display:flex;gap:8px;max-width:540px;margin:0 auto}
#search{flex:1;position:relative}
#search svg{position:absolute;left:14px;top:15px;opacity:.55;pointer-events:none}
#q{width:100%;height:46px;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:0 14px 0 40px;outline:none;border-radius:18px}
#q::placeholder{color:var(--dim)}
#results{position:absolute;top:54px;left:0;right:0;padding:6px}
#results[hidden]{display:none}
#results button{display:block;width:100%;text-align:left;background:none;border:0;padding:11px 12px;border-radius:12px}
#results button:hover,#results button:focus-visible{background:rgba(255,255,255,.07);outline:none}
#results small{color:var(--dim);margin-left:6px}
.ibtn{width:46px;height:46px;flex:none;display:grid;place-items:center;border:1px solid var(--line)}
.ibtn:focus-visible,#play:focus-visible{outline:2px solid var(--hrrr);outline-offset:2px}
#bottom{position:fixed;z-index:1000;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 10px);max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
#sheet{padding:14px 16px 12px}
#sheet[hidden]{display:none}
.hd{display:flex;align-items:flex-start;gap:10px}
#pname{font-weight:600;font-size:16px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ptemp{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
#pclose{background:none;border:0;width:28px;height:28px;margin:-4px -6px 0 0;color:var(--dim);font-size:20px;line-height:1}
#bars{border-bottom:1px solid var(--line);display:grid;grid-template-columns:repeat(24,minmax(0,1fr));gap:2px;height:64px;align-items:end}
.b{position:relative;height:100%;border:0;padding:0;background:none}
.b i{position:absolute;left:0;right:0;bottom:0;border-radius:3px 3px 1px 1px}
.b .pr{background:rgba(255,255,255,.06)}
.b .v{min-height:0}
.t0{background:linear-gradient(#f5d63b,#22c55e)}
.t1{background:linear-gradient(#a78bfa,#60a5fa)}
.t2{background:linear-gradient(#ec4899,#f9a8d4)}
#hours{display:grid;grid-template-columns:repeat(24,minmax(0,1fr));font-size:11px;color:var(--dim);margin-top:4px;height:14px}
#hours span{white-space:nowrap;overflow:visible}
#time{padding:12px 14px 12px}
.row{display:flex;align-items:center;gap:12px}
#play{width:48px;height:48px;flex:none;border-radius:50%;background:var(--ink);color:#0b0f14;border:0;display:grid;place-items:center}
#clockw{flex:1}
#clock{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
#sub{color:var(--dim);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#badge{font-size:12px;font-weight:500;padding:5px 10px;border-radius:99px;white-space:nowrap;border:1px solid currentColor}
#badge.radar{color:#a8b3c2}#badge.hrrr{color:var(--hrrr)}#badge.model{color:var(--model)}
#sw{position:relative;margin:12px 2px 0}
#slider{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;display:block}
#slider::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:var(--track,#334)}
#slider::-moz-range-track{height:6px;border-radius:6px;background:var(--track,#334)}
#slider::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;margin-top:-8px;box-shadow:0 2px 8px rgba(0,0,0,.5);border:0}
#slider::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:0;box-shadow:0 2px 8px rgba(0,0,0,.5)}
#slider:focus-visible{outline:none}#slider:focus-visible::-webkit-slider-thumb{outline:2px solid var(--hrrr);outline-offset:2px}
#ticks{position:relative;height:16px;font-size:11px;color:var(--dim)}
#ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
#ticks span.now{color:var(--ink);font-weight:600}
.foot{display:flex;align-items:center;gap:12px;margin-top:6px;font-size:12px;color:var(--dim);flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:6px}
.lg i{width:28px;height:6px;border-radius:6px}
.lg .r{background:linear-gradient(90deg,#22c55e,#f5d63b,#f97316,#ef4444,#c026d3)}
.scale{display:flex;flex-direction:column;gap:3px;min-width:150px;flex:1;max-width:220px}
.scale i{height:6px;border-radius:6px;background:linear-gradient(90deg,#22c55e,#f5d63b,#f97316,#ef4444,#c026d3)}
.scale span{display:flex;justify-content:space-between;font-size:11px}
.lg i.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.lg .s{background:linear-gradient(90deg,#93c5fd,#3b82f6,#8b5cf6)}
.lg .z{background:linear-gradient(90deg,#f9a8d4,#ec4899,#9d174d)}
#status{margin-left:auto;white-space:nowrap}
.legm{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--ink)}
.legm[hidden]{display:none}
#colorbtn[aria-pressed=true]{background:var(--ink);color:#0b0f14}
#fx{position:fixed;inset:0;z-index:500;pointer-events:none}
#psum{font-size:17px;font-weight:600;color:var(--ink);margin:4px 0 0}
#pdet{color:var(--dim);font-size:13px;margin:2px 0 10px;min-height:18px}
#psum svg{vertical-align:-3px;margin-right:6px}
.pin::after{content:'';position:absolute;inset:-10px;border-radius:50%;border:2px solid rgba(255,255,255,.6);animation:ping 2s ease-out infinite}
.pin{position:relative}
@keyframes ping{from{transform:scale(.4);opacity:1}to{transform:scale(1.6);opacity:0}}
#status.err{color:#fca5a5}
#wx{position:absolute;left:0;top:0;pointer-events:none;image-rendering:auto}
.pin{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #0b0f14;box-shadow:0 0 0 2px #fff,0 4px 12px rgba(0,0,0,.5)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:900px){#bottom{left:auto;right:16px;bottom:16px;width:440px}#top{left:16px;right:auto;width:440px;margin:0}}
</style>
</head>
<body>
<div id="map"></div>
<canvas id="fx" aria-hidden="true"></canvas>

<div id="top">
  <div id="search" class="glass">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Search a place" autocomplete="off" enterkeyhint="search" aria-label="Search a place">
    <div id="results" class="glass" hidden></div>
  </div>
  <button id="colorbtn" class="ibtn glass" aria-label="Show colour radar" aria-pressed="false" title="Colour radar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 2 8.5 12 14l10-5.5z"/><path d="m2 15.5 10 5.5 10-5.5"/></svg>
  </button>
  <button id="locate" class="ibtn glass" aria-label="Use my location">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
  </button>
</div>

<div id="bottom">
  <section id="sheet" class="glass" hidden>
    <div class="hd"><div id="pname">—</div><div id="ptemp"></div><button id="pclose" aria-label="Close">×</button></div>
    <div id="psum">Loading…</div>
    <div id="pdet"></div>
    <div id="bars"></div>
    <div id="hours"></div>
  </section>
  <section id="time" class="glass">
    <div class="row">
      <button id="play" aria-label="Play">
        <svg id="ico" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>
      </button>
      <div id="clockw"><div id="clock">--:--</div><div id="sub">Loading…</div></div>
      <span id="badge" class="radar">Live radar</span>
    </div>
    <div id="sw"><input id="slider" type="range" min="0" max="1" value="0" step="1" aria-label="Time"><div id="ticks"></div></div>
    <div class="foot">
      <span id="legM" class="legm">
        <span class="lg"><svg width="22" height="16" viewBox="0 0 22 16" stroke="#e1eeff" stroke-linecap="round"><path d="M6 13 8 3M15 15l2-10" stroke-width="1.2" opacity=".7"/></svg>Light</span>
        <span class="lg"><svg width="22" height="16" viewBox="0 0 22 16" stroke="#fff" stroke-linecap="round" stroke-width="2.2"><path d="M2 15 5 1M7 15l3-14M12 15l3-14M17 15l3-14"/></svg>Heavy</span>
        <span class="lg"><svg width="16" height="16" viewBox="0 0 24 24" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M12 2v20M3.5 7l17 10M3.5 17l17-10"/></svg>Snow</span>
        <span class="lg"><svg width="14" height="16" viewBox="0 0 14 18" fill="#fff"><path d="M8 0 1 10h5l-2 8 9-11H8l2-7z"/></svg>Storms</span>
      </span>
      <span id="legC" class="legm" hidden>
        <span class="scale"><i></i><span><b style="font-weight:500">Light</b><b style="font-weight:500">Moderate</b><b style="font-weight:500">Heavy</b></span></span>
        <span class="lg"><i class="dot" style="background:#60a5fa"></i>Snow</span><span class="lg"><i class="dot" style="background:#ec4899"></i>Ice</span>
      </span>
      <span id="status"></span>
    </div>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
{
const $ = s => document.querySelector(s);
const IEM = 'https://mesonet.agron.iastate.edu';
const OM = 'https://api.open-meteo.com/v1/forecast';
const DEF = {lat: 40.79, lng: -73.2, z: 8, name: 'Long Island, NY'};
const STEP = 15 * 60e3, HOURS = 24;
let saved = {};
try { saved = JSON.parse(localStorage.getItem('radar24') || '{}'); } catch (e) {}
const save = () => { try { const c = map.getCenter(); localStorage.setItem('radar24', JSON.stringify({lat: c.lat, lng: c.lng, z: map.getZoom(), pt})); } catch (e) {} };

/* ---------- map ---------- */
const map = L.map('map', {zoomControl: false, minZoom: 3, maxZoom: 12, worldCopyJump: true})
  .setView([saved.lat ?? DEF.lat, saved.lng ?? DEF.lng], saved.z ?? DEF.z);
map.createPane('wx').style.zIndex = 350;
map.createPane('lbl').style.zIndex = 450;
map.getPane('lbl').style.pointerEvents = 'none';
const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/';
L.tileLayer(ESRI + 'World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {maxZoom: 12, attribution: 'Esri, HERE, Garmin, © OpenStreetMap'}).addTo(map);
L.tileLayer(ESRI + 'World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {maxZoom: 12, pane: 'lbl'}).addTo(map);
map.attributionControl.setPrefix(false);
map.attributionControl.setPosition('topleft');
map.attributionControl.addAttribution('Radar & HRRR: NWS/NOAA via Iowa Env. Mesonet · Forecast: Open-Meteo');

/* ---------- state ---------- */
let frames = [], cur = 0, nowIdx = 0, playing = false, timer = null, wait = 0;
let hrrrInit = null, hrrrOk = true, hrrrErr = 0, hrrrLoaded = 0, stamp = Date.now();
const layers = new Map();
const slider = $('#slider');

const status = (t, err) => { const s = $('#status'); s.textContent = t || ''; s.className = err ? 'err' : ''; };
const pad = (n, w) => String(n).padStart(w, '0');
const fmtTime = t => new Date(t).toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'});
const fmtHour = t => new Date(t).toLocaleTimeString([], {hour: 'numeric'}).replace(':00', '').replace(' ', '').toLowerCase();
const fmtDur = m => { const h = Math.floor(m / 60), r = m % 60; return h ? (r ? `${h}h ${r}m` : `${h}h`) : `${r}m`; };
const ptype = c => (c >= 71 && c <= 77) || c === 85 || c === 86 ? 1 : (c === 56 || c === 57 || c === 66 || c === 67) ? 2 : 0;

/* ---------- HRRR run ---------- */
async function getInit() {
  try {
    const r = await fetch(`${IEM}/data/gis/images/4326/hrrr/refd_1080.json?_=${Date.now()}`);
    const j = await r.json();
    const d = new Date(String(j.model_init_utc).replace(' ', 'T').replace(/Z?$/, 'Z'));
    if (!isNaN(d)) return {d, s: `${d.getUTCFullYear()}${pad(d.getUTCMonth() + 1, 2)}${pad(d.getUTCDate(), 2)}${pad(d.getUTCHours(), 2)}${pad(d.getUTCMinutes(), 2)}`};
  } catch (e) {}
  const d = new Date(Math.floor((Date.now() - 50 * 60e3) / 3600e3) * 3600e3);
  return {d, s: '0'};
}

/* ---------- frames ---------- */
function buildFrames(keepT) {
  const now = Date.now(), nowR = Math.floor(now / 300e3) * 300e3, end = now + HOURS * 3600e3;
  const f = [];
  for (let k = 10; k >= 0; k--) f.push({k: 'radar', t: nowR - k * 300e3, layer: 'nexrad-n0q-900913' + (k ? `-m${pad(k * 5, 2)}m` : '')});
  nowIdx = f.length - 1;
  let last = nowR;
  if (hrrrOk && hrrrInit) {
    for (let m = 0; m <= 1080; m += 15) {
      const t = hrrrInit.d.getTime() + m * 60e3;
      if (t <= nowR + 60e3) continue;
      if (t > end) break;
      f.push({k: 'hrrr', t, layer: `hrrr::REFP-F${pad(m, 4)}-${hrrrInit.s}`});
      last = t;
    }
  }
  for (let t = Math.floor(last / STEP) * STEP + STEP; t <= end; t += STEP) f.push({k: 'model', t});
  frames = f;
  slider.max = f.length - 1;
  paintTrack();
  let i = nowIdx;
  if (keepT) { let best = 1e15; f.forEach((x, n) => { const d = Math.abs(x.t - keepT); if (d < best) { best = d; i = n; } }); }
  go(i);
}

const COL = {radar: 'var(--radar)', hrrr: 'var(--hrrr)', model: 'var(--model)'};
function paintTrack() {
  const n = frames.length - 1, segs = [];
  let s = 0;
  for (let i = 1; i <= frames.length; i++) {
    if (i === frames.length || frames[i].k !== frames[s].k) { segs.push(`${COL[frames[s].k]} ${(s / n * 100).toFixed(2)}% ${((i - 1) / n * 100).toFixed(2)}%`); s = i; }
  }
  slider.style.setProperty('--track', `linear-gradient(90deg,${segs.join(',')})`);
  const ticks = [`<span class="now" style="left:${nowIdx / n * 100}%">Now</span>`];
  const t0 = frames[nowIdx].t;
  for (const h of [6, 12, 18, 24]) {
    const target = t0 + h * 3600e3;
    let bi = -1, bd = 1e15;
    frames.forEach((x, i) => { const d = Math.abs(x.t - target); if (d < bd) { bd = d; bi = i; } });
    if (bi > 0 && bd < 20 * 60e3) ticks.push(`<span style="left:${Math.min(bi / n * 100, 94)}%">${fmtHour(frames[bi].t)}</span>`);
  }
  $('#ticks').innerHTML = ticks.join('');
}

/* ---------- radar clutter filter ----------
   NEXRAD n0q tiles include clear-air/ground returns below ~10 dBZ.
   Map each colour to the nearest entry of IEM's n0q ramp (index*0.5-32 = dBZ),
   drop anything under MIN_DBZ, then drop isolated speckle pixels. */
const MIN_IDX = (10 + 32) / 0.5;
let ramp = null;
const colIdx = new Map();
const rampP = new Promise(res => {
  const i = new Image(); i.crossOrigin = 'anonymous';
  i.onload = () => {
    try { const c = document.createElement('canvas'); c.width = i.width; c.height = i.height; const x = c.getContext('2d'); x.drawImage(i, 0, 0); ramp = x.getImageData(Math.floor(i.width * 0.66), 0, 1, 256).data; } catch (e) {}
    res();
  };
  i.onerror = () => res();
  i.src = `${IEM}/docs/nexrad_mosaic/n0q_ramp.png`;
});
function rampIdx(r, g, b) {
  let bi = 0, bd = 1e9;
  for (let k = 1; k < 256; k++) { const dr = ramp[k * 4] - r, dg = ramp[k * 4 + 1] - g, db = ramp[k * 4 + 2] - b, dd = dr * dr + dg * dg + db * db; if (dd < bd) { bd = dd; bi = k; } }
  return bi;
}
function declutter(ctx) {
  const im = ctx.getImageData(0, 0, 256, 256), d = im.data, keep = new Uint8Array(65536);
  for (let p = 0, i = 0; p < 65536; p++, i += 4) {
    if (!d[i + 3]) continue;
    const key = (d[i] << 16) | (d[i + 1] << 8) | d[i + 2];
    let v = colIdx.get(key);
    if (v === undefined) { v = rampIdx(d[i], d[i + 1], d[i + 2]) >= MIN_IDX ? 1 : 0; colIdx.set(key, v); }
    keep[p] = v;
  }
  for (let y = 0; y < 256; y++) for (let x = 0; x < 256; x++) {
    const p = y * 256 + x;
    if (!keep[p]) { d[p * 4 + 3] = 0; continue; }
    let n = 0;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      if (!dy && !dx) continue;
      const yy = y + dy, xx = x + dx;
      if (yy < 0 || yy > 255 || xx < 0 || xx > 255 || keep[yy * 256 + xx]) n++;
    }
    if (n < 3) d[p * 4 + 3] = 0;
  }
  ctx.putImageData(im, 0, 0);
}
const RadarLayer = L.GridLayer.extend({
  createTile(co, done) {
    const c = document.createElement('canvas'); c.width = c.height = 256;
    const img = new Image(); img.crossOrigin = 'anonymous';
    img.onload = async () => {
      const x = c.getContext('2d'); x.drawImage(img, 0, 0);
      if (this.options.declutter) { await rampP; if (ramp) { try { declutter(x); } catch (e) {} } }
      done(null, c);
    };
    img.onerror = () => done(new Error('tile'), c);
    img.src = L.Util.template(this.options.url, co);
    return c;
  }
});

/* ---------- tile layers (radar + HRRR) ---------- */
function tl(key) {
  let l = layers.get(key);
  if (!l) {
    const url = `${IEM}/cache/tile.py/1.0.0/${key}/{z}/{x}/{y}.png?_=${stamp}`, o = {pane: 'wx', opacity: 0, maxNativeZoom: 10, maxZoom: 12, keepBuffer: 1, updateWhenZooming: false};
    l = new RadarLayer({...o, url, declutter: key.startsWith('nexrad')});
    l.ready = false;
    l.on('loading', () => { l.ready = false; });
    l.on('load', () => { l.ready = true; fxDirty = true; });
    if (key.startsWith('hrrr')) {
      l.on('tileload', () => { hrrrLoaded++; });
      l.on('tileerror', () => {
        if (++hrrrErr > 16 && !hrrrLoaded && hrrrOk) { hrrrOk = false; status('Hi-res run unavailable, using model', true); buildFrames(frames[cur].t); }
      });
    }
    layers.set(key, l);
    l.addTo(map);
  }
  l.used = performance.now();
  return l;
}
function prune(keep) {
  if (layers.size <= 16) return;
  [...layers.entries()].filter(([k]) => !keep.has(k)).sort((a, b) => a[1].used - b[1].used)
    .slice(0, layers.size - 16).forEach(([k, l]) => { map.removeLayer(l); layers.delete(k); });
}
function hideOthers(active) { layers.forEach(l => { if (l !== active) l.setOpacity(0); }); }

/* ---------- model grid (Open-Meteo) ---------- */
const cache = new Map();
let grid = null, gridBusy = false, gridQueued = false;
const spacingFor = z => z >= 10 ? 0.06 : z >= 9 ? 0.1 : z >= 8 ? 0.18 : z >= 7 ? 0.32 : z >= 6 ? 0.6 : z >= 5 ? 1 : 2;
const normLng = x => ((x + 540) % 360) - 180;
function lattice() {
  const b = map.getBounds();
  let s = spacingFor(map.getZoom());
  for (;;) {

      const c = cache.get(`${g.sk}|${rowI[(p / MW) | 0]}|${colJ[p % MW]}`);
      if (c) code = c.c[Math.max(0, Math.min(c.c.length - 1, Math.round((Ts - (c.t0 - 1800)) / 3600)))];
    }
    const ty = ptype(code), storm = I >= 0.85 || (code >= 95 && I >= 0.45);
    wetIdx[wetN] = p; wetI[wetN] = I; wetW[wetN] = Math.pow(I, 1.6) * (ty === 1 ? 0.6 : 1.4); wetT[wetN] = ty; want += wetW[wetN]; wetN++;

    B.fill(0);

      let sum = 0;
      for (let dy = -1; dy <= 1; dy++) { const yy = y + dy; if (yy < 0 || yy >= MH) continue; const r = yy * MW; for (let dx = -1; dx <= 1; dx++) { const xx = x + dx; if (xx >= 0 && xx < MW) sum += A[r + xx]; } }

}
function spawn(p) {

    const n = (Math.random() * wetN) | 0;
    if (Math.random() > wetW[n] + 0.02) continue;
    const cell = wetIdx[n], I = wetI[n], ty = wetT[n];

    p.I = I; p.ty = ty; p.age = 0;
    if (ty === 1) { p.life = 1.5 + Math.random() * 1.5; p.vy = 22 + I * 38 + Math.random() * 10; p.r = 1.1 + I * 1.8 + Math.random() * 0.6; p.ph = Math.random() * 6.28; }
    else if (ty === 2) { p.life = 0.3 + Math.random() * 0.25; p.vy = 300 + I * 200; }
    else { p.life = 0.25 + Math.random() * 0.25; p.vy = 420 + I * 780 + Math.random() * 80; p.len = 7 + I * 24; }

function addBolt() {
  const cell = stormIdx[(Math.random() * stormN) | 0];
  const x = (cell % MW + 0.5) * MS, y = (((cell / MW) | 0) + 0.5) * MS;
  const pts = [[x + (Math.random() - 0.5) * 30, y - 80 - Math.random() * 40]];
  const segs = 6 + ((Math.random() * 3) | 0);
  for (let k = 1; k <= segs; k++) { const f = k / segs; pts.push([pts[0][0] + (x - pts[0][0]) * f + (Math.random() - 0.5) * 22 * (1 - f * 0.5), pts[0][1] + (y - pts[0][1]) * f]); }
  const bi = 2 + ((Math.random() * 3) | 0), b0 = pts[bi], branch = [b0, [b0[0] + 14 + Math.random() * 10, b0[1] + 16], [b0[0] + 20 + Math.random() * 14, b0[1] + 34]];
  bolts.push({x, y, pts, branch, t: 0});
}
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (ts - fxLast) / 1000 || 0); fxLast = ts;
  if (document.hidden) return;
  if (fxDirty && !fxPause && ts - fxBuilt > 120) { fxDirty = false; fxBuilt = ts; rebuild(); }
  fctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  fctx.clearRect(0, 0, innerWidth, innerHeight);
  if (fxPause || !anchor || map.getZoom() !== buildZoom) return;
  const mr = map.getContainer().getBoundingClientRect(), cp = map.latLngToContainerPoint(anchor);
  const ox = mr.left + cp.x, oy = mr.top + cp.y;
  if (!showColor && wetN) { fctx.imageSmoothingEnabled = true; fctx.imageSmoothingQuality = 'high'; fctx.drawImage(haze, ox, oy, MW * MS, MH * MS); }
  if (reduce) return;
  while (parts.length < want) { const p = {}; if (!spawn(p)) break; p.age = Math.random() * p.life; parts.push(p); }
  if (parts.length > want) parts.length = want;
  fctx.lineCap = 'round';
  for (const p of parts) {
    p.age += dt;
    if (p.age >= p.life) {
      if (p.ty === 0 && p.I > 0.4 && Math.random() < 0.4 && splashes.length < 200) splashes.push({x: p.x, y: p.y, a: 0});
      if (!wetN || !spawn(p)) { p.life = 1e9; continue; }

    const f = p.age / p.life, fade = Math.min(1, f * 6, (1 - f) * 4);

    fctx.strokeStyle = `rgba(225,238,255,${0.6 * (1 - s.a)})`;
    fctx.beginPath(); fctx.ellipse(ox + s.x, oy + s.y, 1 + s.a * 5, 0.5 + s.a * 2, 0, 0, 6.283); fctx.stroke();
  }
  // lightning
  if (stormN && Math.random() < Math.min(3, 0.5 + stormN / 50) * dt && bolts.length < 4) addBolt();
  for (let i = bolts.length - 1; i >= 0; i--) {
    const b = bolts[i]; b.t += dt;
    if (b.t > 0.45) { bolts.splice(i, 1); continue; }
    const t = b.t, a = t < 0.05 ? 1 : t < 0.1 ? 0.25 : t < 0.16 ? 0.85 : Math.max(0, 1 - (t - 0.16) / 0.29);
    const gx = ox + b.x, gy = oy + b.y, gr = fctx.createRadialGradient(gx, gy, 0, gx, gy, 110);
    gr.addColorStop(0, `rgba(255,255,255,${0.42 * a})`); gr.addColorStop(1, 'rgba(255,255,255,0)');

      fctx.save(); fctx.shadowColor = 'rgba(200,220,255,.95)'; fctx.shadowBlur = 12;
      fctx.strokeStyle = `rgba(255,255,255,${a})`; fctx.lineJoin = 'round';
      for (const [path, w] of [[b.pts, 2.4], [b.branch, 1.4]]) {
        fctx.lineWidth = w; fctx.beginPath(); fctx.moveTo(ox + path[0][0], oy + path[0][1]);
        for (let k = 1; k < path.length; k++) fctx.lineTo(ox + path[k][0], oy + path[k][1]);
        fctx.stroke();
      }
      fctx.restore();
    }
  }
}
requestAnimationFrame(frame);

/* ---------- boot ---------- */
(async () => {
  hrrrInit = await getInit();
  buildFrames();
  fetchGrid();
  const p = saved.pt;
  if (p) point(p.lat, p.lng, p.name); else if (!('pt' in saved)) point(DEF.lat, DEF.lng, DEF.name);
})();
}
